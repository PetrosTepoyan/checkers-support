<!DOCTYPE html>
<html lang="en">
<head>

<title>Checkers — Support &amp; Privacy</title>
<style>

  a.btn.secondary { background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.1); }

  <div class="card">
